name: Update macOS catalog
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macos-catalog
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test discovery and merge logic
        run: python3 -m unittest discover -s automation -p 'test_*.py'
      - name: Discover stable Apple installers
        run: python3 automation/update_catalog.py --repository "$GITHUB_REPOSITORY"
      - name: Save new versions and links on GitHub
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard wallpapers)" ]; then
            exit 0
          fi
          git config user.name 'MacDownUp catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json wallpapers
          git commit -m 'Update stable macOS versions and Apple links'
          git pull --rebase origin main
          git push origin HEAD:main
